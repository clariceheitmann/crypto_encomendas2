<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/motorista_atualizar.js"defer></script>
    <title>Atualizar Motorista</title>
</head>
<body>
    <header>
        <nav><a href="../index.html">Home</a></nav>
        <br><hr><br>
    </header>
    <main>
        <h1>Atualizar Motorista</h1>
        <form>
            <label for="id">Código do Motorista</label>
            <input type="email" id="id" required><br>

            <label for="nome">Nome</label>
            <input type="email" id="nome" required><br>

            <label for="cnh">CNH</label>
            <input type="text" id="cnh" required><br>

            <label for="cpf">CPF</label>
            <input type="number" id="cpf" required><br>

            <label for="telefone">Telefone</label>
            <input type="number" id="telefone" required><br>

            <button id="btn_atualizar">Atualizar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
